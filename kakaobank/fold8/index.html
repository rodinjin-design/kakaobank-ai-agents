<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카카오뱅크 Fold</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
#wrap{position:fixed;inset:0;display:flex}
.pane{position:relative;height:100%;overflow:hidden;flex:none;background:#fff}
.pane iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
#rp{border-left:1px solid #E3E5EA;box-sizing:border-box}
</style></head>
<body>
<!-- 펼친 화면: 왼쪽 기본 홈, 오른쪽 카뱅 AI 대화·둘러보기. 접힌 화면: 홈만 -->
<div id="wrap">
 <div class="pane" id="lp"><iframe id="home" src="home.html" title="카카오뱅크 홈"></iframe></div>
 <div class="pane" id="rp"><iframe id="agent" src="agent.html" title="카뱅 AI"></iframe></div>
</div>
<script>
(function(){
var D=390,lp=document.getElementById('lp'),rp=document.getElementById('rp'),h=document.getElementById('home'),a=document.getElementById('agent');
function fit(f,w,H){var s=Math.min(1.2,w/D);f.style.width=D+'px';f.style.height=Math.ceil(H/s)+'px';f.style.transform='scale('+s+')'}
function lay(){var W=innerWidth,H=innerHeight;
 if(W>=560){var half=Math.floor(W/2);lp.style.width=half+'px';rp.style.width=(W-half)+'px';rp.style.display='block';fit(h,half,H);fit(a,W-half,H)}
 else{lp.style.width=W+'px';rp.style.display='none';h.style.transform='none';h.style.width=W+'px';h.style.height=H+'px'}}
lay();addEventListener('resize',lay);addEventListener('orientationchange',function(){setTimeout(lay,200)});
var lw=0,lh=0;setInterval(function(){if(innerWidth!==lw||innerHeight!==lh){lw=innerWidth;lh=innerHeight;lay()}},300);

/* 전체 화면: 펼친 화면에서 어디를 눌러도 상태바·내비게이션바 숨김 */
var d=document,r=d.documentElement,t=null;
function fsEl(){return d.fullscreenElement||d.webkitFullscreenElement}
function go(){if(innerWidth<560||fsEl())return;var f=r.requestFullscreen||r.webkitRequestFullscreen;if(!f)return;try{var p=f.call(r,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}catch(e){}}
function chk(){clearTimeout(t);t=setTimeout(function(){if(innerWidth<560&&fsEl()){var x=d.exitFullscreen||d.webkitExitFullscreen;try{var p=x&&x.call(d);if(p&&p.catch)p.catch(function(){})}catch(e){}}},800)}
function hook(w){['pointerup','touchend','click','keydown'].forEach(function(e){w.addEventListener(e,go,true)})}
hook(window);addEventListener('resize',chk);
/* 홈의 AI 버튼 → 오른쪽 카뱅 AI 대화 열기 */
function wire(f,isHome){f.addEventListener('load',function(){try{var w=f.contentWindow;hook(w);
 if(isHome){w.document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('a[aria-label="AI 어시스턴트"]');if(b&&innerWidth>=560&&a.contentWindow.kbAgent){e.preventDefault();a.contentWindow.kbAgent.open()}},true)}}catch(e){}})}
wire(h,true);wire(a,false);
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
</script>
</body></html>
