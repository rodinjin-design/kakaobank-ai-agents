:root{--ink:#191919;--sub:#6B6F76;--mute:#8A8E96;--faint:#B4B9C2;--line:#EEF0F3;--soft:#F2F3F5;--blue:#3D6DF0;--yellow:#FEE500}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:'Pretendard Variable',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
p,h1,h2{margin:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:84px 0 40px;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
.view>*{max-width:680px;margin-left:auto;margin-right:auto}
/* 상단 */
.top{position:fixed;left:0;right:0;top:0;height:84px;z-index:20;pointer-events:none;background:linear-gradient(#fff 0,#fff 55%,rgba(255,255,255,.85) 75%,rgba(255,255,255,0))}
.top .cb{position:absolute;top:calc(14px + env(safe-area-inset-top));height:50px;min-width:50px;padding:0 16px;border-radius:25px;background:#fff;box-shadow:0 2px 14px rgba(25,30,40,.07);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;pointer-events:auto;color:#2F3442}
.top .l{left:16px;padding:0}.top .r{right:16px}
.mascot{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.mascot .ball{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 4px 18px rgba(25,30,40,.09);display:flex;align-items:center;justify-content:center}
.mascot .nm{margin-top:-8px;height:32px;padding:0 14px;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(25,30,40,.08);display:flex;align-items:center;font-size:15px;font-weight:600}
/* 둘러보기 */
.h1{font-size:24px;font-weight:700;padding:0 20px;letter-spacing:-.3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 17px;border-radius:19px;background:var(--soft);font-size:16px;font-weight:500;white-space:nowrap;color:#2F3442}
.chip.on{background:var(--ink);color:#fff;font-weight:600}
.sec{padding:22px 0 4px}
.sec .sh{display:flex;justify-content:space-between;align-items:center;padding:0 20px 4px}
.sec .sh b{font-size:15px;font-weight:600;color:var(--mute)}
.sec .sh button{font-size:14px;color:var(--faint)}
.task{display:flex;gap:14px;padding:18px 20px 16px;position:relative}
.task+.task:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.task .ic{flex:none;width:40px;height:40px;margin-top:2px}
.task .bd{flex:1;min-width:0}
.task .tt{font-size:17px;font-weight:600;line-height:1.4;letter-spacing:-.2px}
.task .ds{margin-top:5px;font-size:15px;line-height:1.45;color:var(--mute)}
.task .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.task .cnt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--faint)}
.ask{height:34px;padding:0 14px;border-radius:17px;background:var(--soft);font-size:15px;font-weight:600;color:#2F3442}
.ask:active{background:#E6E8EB}
/* 대화 */
#chat{padding-bottom:110px}
.note{margin:0 20px 18px;text-align:center;font-size:13px;color:var(--faint)}
.msg{padding:0 20px;margin-bottom:16px;display:flex}
.msg.me{justify-content:flex-end}
.msg.me .bb{max-width:78%;background:var(--soft);border-radius:20px 20px 6px 20px;padding:11px 16px;font-size:16px;line-height:1.5}
.msg.ai{gap:10px}
.msg.ai .av{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(25,30,40,.1);display:flex;align-items:center;justify-content:center;margin-top:1px}
.msg.ai .tx{flex:1;min-width:0;font-size:16px;line-height:1.55}
.card{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px}
.card .ct{font-size:15px;font-weight:600;margin-bottom:6px}
.card .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px}
.card .row span{color:var(--sub)}
.card .row b{font-weight:600;text-align:right}
.card .btns{display:flex;gap:8px;margin-top:12px}
.card .btns button{flex:1;height:46px;border-radius:12px;font-size:16px;font-weight:600}
.card .ok{background:var(--yellow);color:var(--ink)}
.card .no{background:var(--soft);color:#2F3442}
.card.done{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.dots{display:flex;gap:4px;padding-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg button{height:36px;padding:0 14px;border-radius:18px;border:1px solid #DFE2E7;font-size:15px;color:#2F3442;background:#fff}
#composer{position:fixed;left:16px;right:16px;max-width:680px;margin:0 auto;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;display:none}
#composer.on{display:flex}
#composer form{flex:1;min-width:0;width:100%;display:flex;align-items:center;gap:8px;height:54px;padding:0 7px 0 18px;border-radius:27px;background:#fff;box-shadow:0 4px 18px rgba(25,30,40,.1);border:1px solid var(--line)}
#composer input{flex:1;min-width:0;width:100%;border:0;outline:0;font:inherit;font-size:16px;background:none;color:var(--ink)}
#composer input::placeholder{color:var(--faint)}
#composer .send{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
/* 맡긴 일 */
.empty{padding:60px 20px;text-align:center;color:var(--mute);font-size:15px;line-height:1.6}
.job{display:flex;align-items:center;gap:14px;padding:16px 20px}
.job+.job{border-top:1px solid var(--line)}
.job .ic{flex:none;width:36px;height:36px}
.job .tt{font-size:16px;font-weight:600}
.job .st{margin-top:3px;font-size:14px;color:var(--blue);font-weight:500}
/* 하단 메뉴 */
.bnav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));height:66px;border-radius:33px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 6px 24px rgba(25,30,40,.12),0 0 0 1px rgba(25,30,40,.04);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:30}
.bnav button{flex:1;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center}
.bnav button.on{background:#ECEDEF}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(25,25,25,.9);color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1}
</style></head>

 document.getElementById('chips').innerHTML=CATS.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" role="tab" aria-selected="'+(c===cur)+'" data-c="'+c+'">'+c+'</button>'}).join('');
 var h='';
 if(cur==='전체'){
  var top=T.slice().sort(function(a,b){return b.n-a.n}).slice(0,3);
  h+=sec('요즘 많이 맡긴 일',top);

  CATS.slice(1).forEach(function(c){var it=T.filter(function(x){return x.cat===c&&top.indexOf(x)<0}).slice(0,2);if(it.length)h+=sec(c,it,c)});
 }else h+=sec(cur,T.filter(function(x){return x.cat===cur}));
 document.getElementById('list').innerHTML=h;
}

 if(v==='jobs')renderJobs();if(v==='chat')toBottom()}

 setTimeout(function(){d.querySelector('.tx').innerHTML=html;toBottom();cb&&cb(d)},delay||700)}
