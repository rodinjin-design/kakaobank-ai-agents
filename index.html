<style>
/* Layout: same phone shell as the salary prototype. Home → handoff → 4 agent steps (top-up, apply, allocation + sell condition, order) → journey. The pill to tap next always shows the yellow nudge. */
:root{
--bg:#FFFFFF; --ink:#2B2A27; --sub:#6B7280; --mute:#8A867B; --line:#E6E2D6;
--blue:#3A63D8; --blue2:#8FA8E8; --sand:#C9C4B6; --nudge:#F7EE6E; --btn:#111111; --warn:#B54708; --soft:#F5F5F6;
--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 4px 12px rgba(247,238,110,.8)}50%{box-shadow:0 4px 18px rgba(247,226,60,1)}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite;margin-right:3px}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.fade,.dot,.gp .go{animation:none!important}}
.topbar{flex:none;height:56px;padding:0 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.topbar>:last-child{justify-self:end;display:flex;align-items:center}
.topbar>:first-child{justify-self:start}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.icon-btn:hover{background:rgba(25,27,31,.05)}
.spacer{width:44px;height:44px}
.agent-title{font-size:16px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.flow{min-height:100%;padding:0 20px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.ava{flex:none;height:44px;display:flex;align-items:center}
.ai{font-size:18px;line-height:1.5;font-weight:400;letter-spacing:-.2px;word-break:keep-all;margin:0}
.ai b{font-weight:700}
.ai{text-wrap:balance}
.ai-s{font-size:14px;color:var(--sub);word-break:keep-all;margin-top:6px;display:block;letter-spacing:0}
.aimsg{font-size:16px;margin:0;word-break:keep-all}
.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:22px;padding:11px 18px;font-size:15px;font-weight:500;max-width:84%;word-break:keep-all}
.status{display:flex;align-items:center;gap:8px;font-size:15px;color:#3B4252;word-break:keep-all}
/* reply pills */
.replies{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.gp{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid rgba(25,27,31,.22);background:transparent;border-radius:22px;padding:0 18px;font-size:15px;font-weight:500;color:var(--ink);transition:padding .2s,background .2s,box-shadow .2s;text-align:left}
.gp:hover{background:rgba(25,27,31,.03)}
.gp .go{display:none;flex:none;width:32px;height:32px;border-radius:50%;background:var(--nudge);align-items:center;justify-content:center;animation:glow 1.8s ease-in-out infinite}
.gp[aria-pressed=true]{background:#fff;padding-right:6px;border-color:rgba(25,27,31,.12);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.gp[aria-pressed=true] .go{display:flex}
/* info cards */
.chart{background:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(60,50,30,.07)}
.chart .k{font-size:12px;font-weight:600;color:var(--blue)}
.bar{height:12px;border-radius:6px;overflow:hidden;display:flex;gap:2px;margin:8px 0 6px}
.bar div{height:100%}
.leg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.leg:first-of-type{border-top:0}
.leg .sw{flex:none;width:10px;height:10px;border-radius:3px}
.leg .n{flex:1;min-width:0;word-break:keep-all}
.leg .n em{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.leg .p{color:var(--sub);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.leg .a{font-weight:700;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--sub);word-break:keep-all;margin-top:4px}
.small.warn{color:var(--warn)}
.ag{flex:none;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;background:var(--soft);color:#3B4252;white-space:nowrap}
.ag.ok{background:#E8EFFC;color:var(--blue)}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.trow:first-of-type{border-top:0}
.day{flex:none;width:46px;text-align:center;font-size:12px;font-weight:700;border-radius:10px;padding:2px 0;background:var(--soft);font-variant-numeric:tabular-nums}
.trow .n{flex:1;min-width:0;word-break:keep-all}
.trow .n em{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.scan{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;word-break:keep-all}
.scan:first-of-type{border-top:0}
.scan .t{flex:1;min-width:0}
.cki{flex:none;width:20px;height:20px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;margin-top:1px}
.notif{background:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(60,50,30,.08);border:1px solid var(--line)}
.nh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.nh .day{width:auto;padding:2px 10px}
.notif b{font-size:16px;word-break:keep-all}
.notif p{margin:0;font-size:14px;color:#3B4252;word-break:keep-all}
.card{background:#fff;border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.07)}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--blue)}
.ck i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:14px}
.card .sub{font-size:14px;color:var(--sub);margin-top:4px;word-break:keep-all}
.rows{margin-top:14px;display:flex;flex-direction:column}
.sumrow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:15px}
.sumrow span:first-child{color:var(--sub);flex:none}
.sumrow span:last-child{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.endrow{display:flex;justify-content:flex-end}
.next{height:46px;padding:0 24px;border:0;border-radius:23px;background:var(--btn);color:#fff;font-weight:600;font-size:15px}
/* chat room */
/* more menu + add-to-home sheet */
#ov{display:none}
#ov.on{display:block;position:fixed;inset:0;z-index:50}
.ov-bg{position:absolute;inset:0}
#ov.dim .ov-bg{background:rgba(20,20,20,.38)}
.pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);right:12px;min-width:250px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.16);border:1px solid var(--line)}
.pop-i{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:transparent;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.pop-i:hover{background:rgba(25,27,31,.05)}
.pi-ic{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.sheetp{position:absolute;left:0;right:0;bottom:0;background:#FBFAF6;border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(60,50,30,.12);padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.sp-h{display:flex;align-items:center;gap:14px}
.sp-h b{display:block;font-size:20px;letter-spacing:-.3px}
.sp-h span:not([style]){display:block;font-size:14px;color:var(--sub)}
.sp-tabs{display:flex;gap:8px;margin:16px 0 4px}
.sp-tabs button{min-height:36px;border:1px solid transparent;background:#EDEAE1;border-radius:18px;padding:0 16px;font-size:14px;font-weight:500;color:var(--ink)}
.sp-tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.sp-steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;word-break:keep-all}
.sp-steps li::marker{font-weight:700;color:var(--sub)}
.sp-note{font-size:12px;color:var(--mute);margin:12px 0 0;word-break:keep-all}
.sp-btns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.chipb{min-height:44px;border:1px solid rgba(25,27,31,.22);background:transparent;border-radius:22px;padding:0 18px;font-size:15px;font-weight:500;color:var(--ink)}
.fbin{width:100%;box-sizing:border-box;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);background:#fff}
.gp{max-width:100%}
/* intelligent info cards */
.vis{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(60,50,30,.07);display:flex;flex-direction:column;gap:14px}
.vk{font-size:12px;font-weight:600;color:var(--blue)}
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero b{font-size:28px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;word-break:keep-all}
.hero span{font-size:13px;color:var(--sub)}
.track{position:relative;height:12px;border-radius:6px;background:#EDEAE1}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--blue)}
.mk{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--blue);transform:translate(-50%,-50%);box-sizing:border-box;box-shadow:0 2px 8px rgba(58,99,216,.35)}
.td{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#B9B4A4;transform:translate(-50%,-50%);z-index:0}
.gauge{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:#EDEAE1}
.gauge .have{background:var(--blue)}
.gauge .need{background:#E3E5E9}
.legs{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--sub)}
.legs b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:1px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.c2{font-size:12px;background:var(--soft);border-radius:12px;padding:3px 10px;color:#3B4252}
.ins{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;color:#3B4252;word-break:keep-all}
.flowx{display:flex;align-items:stretch;gap:6px}
.acct{flex:1;min-width:0;background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px}
.acct em{font-style:normal;font-size:11px;color:var(--sub)}
.acct b{font-size:15px;word-break:keep-all}
.acct .bal{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1.6}
.acct .bal s{color:var(--mute)}
.acct .bal strong{color:var(--ink);font-size:13px}
.arr{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;max-width:70px;text-align:center;word-break:keep-all}
.dotsgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dotsgrid i{aspect-ratio:1;border-radius:50%;background:#EDEAE1}
.dotsgrid i.on{background:var(--blue);box-shadow:0 2px 6px rgba(58,99,216,.35)}
.lad{padding:6px 26px 0}
.ticks{position:relative;height:40px;margin-top:10px}
.tick{position:absolute;transform:translateX(-50%);text-align:center;font-size:11px;line-height:1.4;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.on{color:var(--ink);font-weight:700}
.st4{position:relative;display:flex}
.st4::before{content:"";position:absolute;left:12.5%;right:12.5%;top:5px;height:2px;background:#E1DED3}
.st4f{position:absolute;left:12.5%;top:5px;height:2px;background:var(--blue);transition:width .4s}
.sd{position:relative;flex:1;text-align:center;font-size:11px;color:var(--mute);word-break:keep-all}
.sd i{display:block;width:12px;height:12px;border-radius:50%;background:#DAD6C9;margin:0 auto 6px;box-shadow:0 0 0 3px #fff}
.sd.on{color:var(--ink);font-weight:600}
.sd.on i{background:var(--blue)}
.wfs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.wf{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;font-size:13px}
.wf>span{color:var(--sub)}
.wf>div{height:12px;border-radius:6px;background:#F3F1EA;overflow:hidden}
.wf i{display:block;height:100%;border-radius:6px}
.wf b{font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
/* biometric sheet + 2-line bubbles */
.me{line-height:1.45;text-wrap:balance;border-radius:20px}
.gp{padding:8px 18px;border-radius:24px}
.gp>span{line-height:1.4;text-wrap:balance;word-break:keep-all}
.bio{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.bio-bg{position:absolute;inset:0;background:rgba(20,20,20,.38)}

function gaugeCard(c){
  var have=Math.round(BAL/c.margin*100);

function applyCard(c){

var GMAX=60000;
function goalCard(c){
  var pos=function(p){return Math.round((p-PRICE)/(GMAX-PRICE)*100)}, sel=pos(c.target);
  var ticks='<div class="tick" style="left:0">공모가<br>'+won(PRICE).replace('원','')+'</div>';
  GOALS.forEach(function(g){var p=Math.round(PRICE*(1+ +g.v/100));ticks+='<div class="tick'+(g.v===st.goal?' on':'')+'" style="left:'+pos(p)+'%">'+g.l+'<br>'+won(p).replace('원','')+'</div>'});
  var dots='<i class="td" style="left:0"></i>';GOALS.forEach(function(g){dots+='<i class="td" style="left:'+pos(Math.round(PRICE*(1+ +g.v/100)))+'%"></i>'});

function trackSteps(n,labels){
  var h='<div class="st4"><div class="st4f" style="width:'+Math.max(0,(n-1))/(labels.length-1)*75+'%"></div>';
  labels.forEach(function(l,i){h+='<div class="sd'+(i<n?' on':'')+'"><i></i>'+l+'</div>'});
  return h+'</div>';
}

/* 2줄 이상 말풍선·버튼은 가장 긴 줄 폭에 맞춰 우측 여백 제거 */
function fitBubbles(){
  var els=document.querySelectorAll('.me,.bub,.gp>span');
  els.forEach(function(el){el.style.width=''});
  els.forEach(function(el){
    var r=document.createRange();r.selectNodeContents(el);
    var rects=r.getClientRects();if(rects.length<2)return;
    var w=0;for(var i=0;i<rects.length;i++)w=Math.max(w,rects[i].width);
    var full=el.getBoundingClientRect().width,cs=getComputedStyle(el);
    var pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    var target=Math.ceil(w)+(cs.boxSizing==='border-box'?pad:0)+1;
    if(target<full-2)el.style.width=target+'px';
  });
}
window.addEventListener('resize',fitBubbles);
try{document.fonts&&document.fonts.ready.then(fitBubbles)}catch(e){}

/* 증분 렌더링: 바뀐 노드만 교체해서 기존 내용이 다시 로드되며 튀지 않게 */
function sigAll(el){Array.prototype.forEach.call(el.children,function(c){c._sig=c.outerHTML;var f=c.classList.contains('scroll')&&c.firstElementChild;if(f&&f.classList.contains('flow')){Array.prototype.forEach.call(f.children,function(x){x._sig=x.outerHTML})}})}
function syncList(o,n){
  var oc=Array.prototype.slice.call(o.children),nc=Array.prototype.slice.call(n.children);

<meta name="apple-mobile-web-app-title" content="월급 나눠 담기">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen phone app, same as the tax AI prototype. Home chat → handoff → agent conversation (one question at a time, right-aligned reply pills) → result card. The pill to tap next always shows the yellow nudge. */
:root{
--bg:#FFFFFF; --ink:#2B2A27; --sub:#6B7280; --mute:#8A867B; --line:#E6E2D6;
--blue:#3A63D8; --nudge:#F7EE6E; --btn:#111111; --warn:#B54708;
--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 4px 12px rgba(247,238,110,.8)}50%{box-shadow:0 4px 18px rgba(247,226,60,1)}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite;margin-right:3px}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.fade,.dot,.gp .go{animation:none!important}}
.topbar{flex:none;height:56px;padding:0 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.topbar>:last-child{justify-self:end;display:flex;align-items:center}
.topbar>:first-child{justify-self:start}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.icon-btn:hover{background:rgba(25,27,31,.05)}
.spacer{width:44px;height:44px}
.agent-title{font-size:16px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.flow{min-height:100%;padding:0 20px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
.ava{flex:none;height:44px;display:flex;align-items:center}
.ai{font-size:18px;line-height:1.5;font-weight:400;letter-spacing:-.2px;word-break:keep-all;margin:0}
.ai b{font-weight:700}
.ai-s{font-size:14px;color:var(--sub);word-break:keep-all;margin-top:6px;display:block;letter-spacing:0}
.aimsg{font-size:16px;margin:0;word-break:keep-all}
.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:22px;padding:11px 18px;font-size:15px;font-weight:500;max-width:80%}
.status{display:flex;align-items:center;gap:8px;font-size:15px;color:#3B4252}
/* reply pills */
.replies{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.gp{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid rgba(25,27,31,.22);background:transparent;border-radius:22px;padding:0 18px;font-size:15px;font-weight:500;color:var(--ink);transition:padding .2s,background .2s,box-shadow .2s}
.gp:hover{background:rgba(25,27,31,.03)}
.gp .go{display:none;width:32px;height:32px;border-radius:50%;background:var(--nudge);align-items:center;justify-content:center;animation:glow 1.8s ease-in-out infinite}
.gp[aria-pressed=true]{background:#fff;padding-right:6px;border-color:rgba(25,27,31,.12);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.gp[aria-pressed=true] .go{display:flex}
/* preview / result cards */
.glass{background:#F5F5F6;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.prow span:first-child{color:var(--sub)}
.prow span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.prow.warn span:last-child{color:var(--warn)}
.card{background:#fff;border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.07)}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--blue)}
.ck i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}

var DEFAULTS={go:'plan',plan:'trip',rev:'ok',ratio:'r1',acct:'safe',mode:'monthly'};
var st={phase:'home',step:0,msgs:[],user:'',hs:0,authing:false,bio:null};
function resetSel(){st.said='';for(var k in DEFAULTS)st[k]=DEFAULTS[k]}
resetSel();
var timers=[];
function set(p){for(var k in p)st[k]=p[k];render()}

/* ---------- 핵심 로직 ---------- */
function calc(){
  var r=ratios.filter(function(x){return x.id===st.ratio})[0];
  var save=Math.floor(SALARY*r.s/100/1000)*1000;  // 천 원 단위 내림
  var inv=Math.floor(SALARY*r.i/100/1000)*1000;
  var live=SALARY-save-inv;                        // 끝자리는 생활비에 남김
  var acct=accts.filter(function(a){return a.id===st.acct})[0];
  var mode=modes.filter(function(m){return m.id===st.mode})[0];
  var pl=PLANS.filter(function(x){return x.id===st.plan})[0];
  var base={save:save,inv:inv,live:live,spare:live-FIXED};
  var use=st.go==='plan'&&pl.amt>0, res=use?pl.amt:0, cutI=0, cutS=0;
  if(use){var short=Math.max(0,res-base.spare);if(short>0){cutI=Math.min(inv,Math.ceil(short/10000)*10000);var rest=Math.max(0,short-cutI);cutS=Math.ceil(rest/10000)*10000}}
  var save2=save-cutS, inv2=inv-cutI, live2=SALARY-save2-inv2;
  return {r:r,base:base,plan:pl,use:use,res:res,cutI:cutI,cutS:cutS,save:save2,inv:inv2,live:live2,free:live2-res,spare:live2-res-FIXED,acct:acct,mode:mode,year:acct.bal+save2*12};
}

/* ---------- icons ---------- */
var STAR=function(n,g){return '<svg aria-hidden="true" width="'+n+'" height="'+n+'" viewBox="0 0 24 24"><defs><linearGradient id="'+g+'" x1="0.1" y1="0.05" x2="0.9" y2="0.95"><stop offset="0" stop-color="#4FC4FC"/><stop offset=".38" stop-color="#6DD3BE"/><stop offset=".72" stop-color="#A5DC43"/><stop offset="1" stop-color="#D8E24B"/></linearGradient></defs><path d="M12 4.6Q14.2 9.8 19.4 12Q14.2 14.2 12 19.4Q9.8 14.2 4.6 12Q9.8 9.8 12 4.6Z" fill="url(#'+g+')" stroke="url(#'+g+')" stroke-width="4.4" stroke-linejoin="round"/><rect x="11.05" y="8.3" width="1.9" height="7.4" rx=".25" fill="#fff"/></svg>'};
var BADGE=function(n,g){return '<svg aria-hidden="true" width="'+Math.round(n*1.2)+'" height="'+n+'" viewBox="0 0 30 25"><defs><clipPath id="'+g+'c"><circle cx="19" cy="12.5" r="9"/></clipPath></defs><circle cx="11" cy="12.5" r="9" fill="#58D08C"/><circle cx="19" cy="12.5" r="9" fill="#2F66E3"/><circle cx="11" cy="12.5" r="9" fill="#3FB8A6" clip-path="url(#'+g+'c)"/><text x="15" y="17" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Pretendard,system-ui,sans-serif">₩</text></svg>'};
var MIC='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
var PLUS='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var WAVE='<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" stroke-linejoin="round"/></svg>';
var BACK='<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
var ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#191B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var CHECK='<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- pieces ---------- */
function gp(attr,label,on,ag){return '<button class="gp" '+attr+' aria-pressed="'+(!!on)+'"><span>'+label+'</span><i class="go" aria-hidden="true">'+ARROW+'</i></button>'}
function composer(ph){return '<div class="foot"><div class="composer"><textarea id="in" rows="1" aria-label="'+ph+'" placeholder="'+ph+'" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea><div class="tools"><button class="plus" aria-label="추가">'+PLUS+'</button><div class="rt"><button class="mic" aria-label="음성으로 입력">'+MIC+'</button><button class="send" id="send" aria-label="보내기">'+WAVE+'</button></div></div></div></div>'}
function prow(a,b,w){return '<div class="prow'+(w?' warn':'')+'"><span>'+a+'</span><span>'+b+'</span></div>'}
function sr(a,b){return '<div class="sumrow"><span>'+a+'</span><span>'+b+'</span></div>'}
function agst(t,done){return '<div class="status fade"><span style="display:inline-flex;'+(done?'':'animation:pulse 1.2s infinite')+'">'+BADGE(20,'hb')+'</span><span>'+t+'</span>'+(done?'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2FB67C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'')+'</div>'}
function dots(t){return '<div class="status fade"><span class="tdots" aria-hidden="true"><i></i><i></i><i></i></span><span class="stt">'+t+'</span></div>'}

/* ---------- home ---------- */
function incomeCard(){
  return '<div class="chart fade"><span class="k">오늘 들어온 월급</span><div class="incm"><b>+'+fmt(SALARY)+'</b><span>'+PAYER+' · 오늘 '+PAID_AT.replace('10월 23일 ','')+'</span></div><div class="rows" style="margin-top:8px">'+sr('입금 후 '+LIVE+' 잔액',fmt(4126000))+sr('이번 달 고정지출 예정',fmt(FIXED))+'</div></div>';
}
function homeHTML(){
  var A=homeShown?'':' fade';
  var h='<div class="screen"><div class="topbar"><button class="listb" id="chats" aria-label="챗 목록">'+LISTI+'</button><span></span>'+MORE+'</div><div class="scroll" id="sc"><div class="flow">';
  h+='<div class="ava'+A+'">'+STAR(44,'g1')+'</div>';
  h+='<p class="ai'+A+'"><b>월급이 들어왔어요.</b><span class="ai-s">입금을 확인했어요. 저축과 투자로 나눠 볼까요?</span></p>';
  h+=incomeCard();
  if(st.phase==='home'){
    st.msgs.forEach(function(m){h+=m.w==='me'?'<div class="me fade">'+esc(m.t)+'</div>':'<p class="aimsg fade">'+esc(m.t)+'</p>'});
    h+='<div class="replies'+A+'">'+gp('data-menu="0"','월급 나눠 담기',true)+gp('data-menu="9"','오늘은 넘어갈게요',false)+'</div>';
  }else{
    h+='<div class="me fade">'+esc(st.user)+'</div>';
    h+=agst(st.hs?AGENT+'가 이어받았어요':AGENT+'에게 넘기고 있어요',st.hs);
  }
  h+='</div></div>'+composer('무엇이든 물어보세요')+'</div>';
  return h;
}
var homeShown=false;
function startHandoff(text){
  timers.forEach(clearTimeout);timers=[];
  resetSel();
  set({phase:'handoff',user:text,hs:0});
  timers.push(setTimeout(function(){if(st.phase==='handoff')set({hs:1})},1200));
  timers.push(setTimeout(function(){if(st.phase==='handoff')set({phase:'agent',step:0,authing:false})},2400));
}

function leg(col,name,p,a){return '<div class="leg"><i class="sw" style="background:'+col+'"></i><span class="n">'+name+'</span><span class="p">'+p+'%</span><span class="a">'+fmt(a)+'</span></div>'}
function pc(x){return Math.max(0,x/SALARY*100).toFixed(2)}
function chartHTML(c,title){
  var h='<div class="chart fade"><span class="k">'+(title||'월급 '+fmt(SALARY)+' 기준')+'</span>';
  var lv=c.live-c.res;
  h+='<div class="bar" role="img" aria-label="월급 분배"><div style="width:'+pc(c.save)+'%;background:var(--blue)"></div><div style="width:'+pc(c.inv)+'%;background:var(--ink)"></div>'+(c.res?'<div style="width:'+pc(c.res)+'%;background:var(--green)"></div>':'')+'<div style="width:'+pc(lv)+'%;background:#C9C4B6"></div></div>';
  var p=function(x){return Math.round(x/SALARY*100)};
  h+=leg('var(--blue)','저축',p(c.save),c.save)+leg('var(--ink)','투자',p(c.inv),c.inv);
  if(c.res)h+=leg('var(--green)','계획 · '+c.plan.nm,p(c.res),c.res);
  h+=leg('#C9C4B6','생활비',p(lv),lv);
  h+=c.spare<0?'<span class="small warn">고정지출 예정 '+fmt(FIXED)+'보다 '+fmt(-c.spare)+' 부족해요.</span>':'<span class="small">고정지출 예정 '+fmt(FIXED)+'을 내고도 '+fmt(c.spare)+'이 남아요.</span>';
  return h+'</div>';
}
function dr(a,b,c2){return '<div class="drow"><span>'+a+'</span><span class="df">'+b+'</span><span class="dt'+(c2?' dn':'')+'">'+c2+'</span></div>'}
/* ---------- agent steps ---------- */
function calc0(){var o={go:st.go,plan:st.plan};st.go='split';var c=calc();st.go=o.go;return c}
function stepHTML(c){
  var s=st.step,h='';
  if(s===0){
    var c0=calc0();
    h+='<p class="ai fade">지난달 비율로 <b>이렇게 나눠 볼게요.</b><span class="ai-s">'+fmt(SALARY)+'을 저축·투자·생활비로 나눈 제안이에요.</span></p>';
    h+=chartHTML(c0,'분배 제안 · 지난달과 같은 비율');
    h+='<div class="replies fade">'+gp('data-k="go" data-v="plan"','이번 달 계획에 맞춰 수정',st.go==='plan')+gp('data-k="go" data-v="split"','제안대로 나눠 담기',st.go==='split')+gp('data-k="go" data-v="skip"','이번 달은 넘어가기',st.go==='skip')+'</div>';
  }
  if(s===1){
    h+='<p class="ai fade"><b>이번 달 계획</b>을 알려 주세요.<span class="ai-s">카드 승인 내역과 캘린더에서 이번 달 큰 지출 두 가지를 찾았어요. 계획 금액은 먼저 떼어 둘게요.</span></p>';
    h+='<div class="chart fade"><span class="k">내역에서 확인한 이번 달 계획</span>'+PLANS.slice(0,2).map(function(x){return '<div class="pl2"><i class="sw" style="background:var(--green)"></i><div class="pm"><div class="l1"><b>'+x.nm+'</b><span class="a">'+fmt(x.amt)+'</span></div><div class="l2"><span class="src">'+x.src+'</span><em>'+x.d+' · '+x.when+'</em></div></div></div>'}).join('')+'<span class="small">고정지출 예정 '+fmt(FIXED)+' · 지금 비율대로면 '+fmt(calc0().spare)+'이 남아요.</span></div>';
    h+='<div class="replies fade">'+PLANS.map(function(x){return gp('data-k="plan" data-v="'+x.id+'"',x.label,st.plan===x.id)}).join('')+'</div>';
  }
  if(s===2){
    h+='<p class="ai fade">'+(c.cutI||c.cutS?'<b>'+c.plan.nm+' '+fmt(c.res)+'</b>을 먼저 떼고 다시 나눴어요.':'<b>'+c.plan.nm+' '+fmt(c.res)+'</b>을 떼어 두고, 나머지는 그대로 나눠요.')+'<span class="ai-s">'+(c.cutI||c.cutS?'생활비로 모자란 '+fmt(c.cutI+c.cutS)+'은 '+(c.cutS?'투자와 저축에서':'투자에서')+' 줄였어요.':'생활비 여유가 충분해서 저축·투자는 그대로예요.')+'</span></p>';
    h+=chartHTML(c,'이번 달 계획 반영');
    h+='<div class="chart fade"><span class="k">제안에서 달라진 점</span>'+dr('저축',fmt(c.base.save),c.save!==c.base.save?fmt(c.save):'동일')+dr('투자',fmt(c.base.inv),c.inv!==c.base.inv?fmt(c.inv):'동일')+dr('계획 자금','—',fmt(c.res))+'<span class="small">계획 자금은 '+LIVE+'에 따로 표시해 두고, 결제일에 알려 드려요.</span></div>';
    h+='<div class="replies fade">'+gp('data-k="rev" data-v="ok"','이대로 진행',true)+gp('data-k="rev" data-v="ratio"','비율 직접 고르기',false)+'</div>';
  }
  if(s===3){
    h+='<p class="ai fade"><b>어떤 비율로</b> 나눌까요?<span class="ai-s">지난달에는 저축 20% · 투자 10%로 나눴어요. 생활비는 남는 금액으로 계산해요.</span></p>';
    h+=chartHTML(c);
    h+='<div class="replies fade">';ratios.forEach(function(r){h+=gp('data-k="ratio" data-v="'+r.id+'"',r.label,st.ratio===r.id)});h+='</div>';
  }
  if(s===4){
    h+='<p class="ai fade">저축 <b>'+fmt(c.save)+'</b>은 어디에 모을까요?<span class="ai-s">이 금액으로 1년 모으면 '+c.acct.label+'에 '+fmt(c.year)+'이 쌓여요. 이자는 빼고 계산했어요.</span></p>';
    h+='<div class="replies fade">';accts.forEach(function(a){h+=gp('data-k="acct" data-v="'+a.id+'"',a.label,st.acct===a.id)});h+='</div>';
  }
  if(s===5){
    h+='<p class="ai fade">'+c.acct.label+'에 <b>'+fmt(c.save)+'</b>, '+INV+'에 <b>'+fmt(c.inv)+'</b>을 옮길게요.<span class="ai-s">'+LIVE+'에 생활비 '+fmt(c.live-c.res)+'이 남아요.'+(c.res?' 계획 자금 '+fmt(c.res)+'은 따로 둬요.':'')+' 다음 달에도 이렇게 할까요?</span></p>';
    h+='<div class="replies fade">';modes.forEach(function(m){h+=gp('data-k="mode" data-v="'+m.id+'"',m.label,st.mode===m.id)});h+='</div>';
  }
  if(s===6){
    h+='<p class="ai fade">승인하면 <b>2건을 바로 이체</b>해요.<span class="ai-s">'+LIVE+'에서 총 '+fmt(c.save+c.inv)+'이 빠져나가요.</span></p>';
    h+=st.authing?'':'<div class="replies fade">'+gp('data-k="auth" data-v="ok"','인증하고 이체하기',true)+'</div>';
  }
  if(s===7)h+=resultHTML(c);
  return h;
}
function resultHTML(c){
  var h='';
  if(st.go==='skip'){
    h+='<p class="ai fade">이번 달은 <b>그대로 둘게요.</b></p>';
    h+='<div class="card fade"><div class="ck"><i class="off">'+CHECK+'</i>분배 건너뜀</div><div class="big">'+fmt(SALARY)+'</div><div class="sub">'+LIVE+'에 그대로 있어요.</div><div class="rows">'+sr('다음 확인','11월 23일 월급 입금 시')+'</div><div class="note">원하실 때 “월급 나눠 담기”로 바로 옮길 수 있어요.</div></div>';
  }else if(st.mode==='view'){
    h+='<p class="ai fade">금액만 <b>확인했어요.</b></p>';
    h+='<div class="card fade"><div class="ck"><i class="off">'+CHECK+'</i>분배 미리보기</div><div class="big">월 '+fmt(c.save+c.inv)+'</div><div class="sub">이체하지 않았어요.</div><div class="rows">'+sr('저축 · '+c.acct.label,fmt(c.save))+sr('투자 · '+INV,fmt(c.inv))+sr('남는 생활비',fmt(c.live-c.res))+'</div><div class="note">참고용 예상치예요.</div></div>';
  }else{
    h+='<p class="ai fade">분배를 <b>마쳤어요.</b></p>';
    h+='<div class="card fade"><div class="ck"><i>'+CHECK+'</i>월급 분배 플랜</div><div class="big">월 '+fmt(c.save+c.inv)+'</div><div class="sub">'+(st.mode==='monthly'?'월급일마다 옮기기 전에 알려 드려요.':'이번 달만 옮겼어요.')+'</div>';
    h+='<div class="rows">'+sr('저축 · '+c.acct.label,fmt(c.save))+sr('투자 · '+INV,fmt(c.inv))+sr('남은 생활비',fmt(c.live-c.res))+(c.res?sr('계획 자금 · '+c.plan.nm,fmt(c.res)):'')+sr('반복',st.mode==='monthly'?PAYDAY+' (월급일)':'이번 달만')+'</div>';
    h+='<div class="note">'+(c.res?'계획 자금은 이번 달에만 반영돼요. 다음 월급일에 다시 물어볼게요. ':'')+'시연용 화면이에요. 설정은 언제든 바꿀 수 있어요.</div></div>';
  }
  h+='<div class="endrow fade"><button class="next" id="home">처음으로</button></div>';
  return h;
}
function agentHTML(){
  var c=calc();
  var h='<div class="screen"><div class="topbar"><button class="icon-btn" id="back" aria-label="뒤로"'+(st.authing?' disabled':'')+'>'+BACK+'</button><span class="agent-title"><span class="bw">'+BADGE(22,'b1')+'</span>'+AGENT+'</span>'+MORE+'</div>';
  h+='<div class="scroll" id="sc"><div class="flow">'+saidHTML()+stepHTML(c)+'</div></div>'+composer(AGENT+'에게 질문하세요')+(st.bio?bioHTML('이체 승인','저축 · 투자 '+fmt(c.save+c.inv)+'을 이체해요'):'')+'</div>';
  return h;
}

/* ---------- 생체인증 (iOS Face ID 자동 인증 예시) ---------- */
var IOS=/iPhone|iPad|iPod/.test(navigator.userAgent), BIO_L=IOS?'Face ID':'생체 인증';
var FACEID='<svg aria-hidden="true" width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="#3A63D8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a5 5 0 015-5h5M32 6h5a5 5 0 015 5v5M42 32v5a5 5 0 01-5 5h-5M16 42h-5a5 5 0 01-5-5v-5"/><path d="M17 19v4M31 19v4M24 19v8h-3M18 33c3.5 3 8.5 3 12 0"/></svg>';
var BIO_CK='<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function bioHTML(title,sub){
  var ok=st.bio==='ok';
  return '<div class="bio" role="dialog" aria-label="'+BIO_L+' 인증"><div class="bio-bg"></div><div class="bio-sh fade"><span class="t">'+title+'</span><span class="s">'+sub+'</span><div class="bio-ic">'+(ok?'<span class="bio-ok">'+BIO_CK+'</span>':FACEID+'<i class="scanl"></i>')+'</div><span class="bio-cap">'+(ok?'인증됐어요':BIO_L+'로 인증하고 있어요')+'</span><span class="bio-note">'+(ok?'':(IOS?'iPhone에서는 Face ID가 자동으로 실행돼요':'기기의 생체인증이 자동으로 실행돼요'))+'</span></div></div>';
}
function bioRun(done){
  set({bio:'scan'});
  timers.push(setTimeout(function(){if(st.phase==='agent')set({bio:'ok',_still:1})},1400));

<style>
/* Layout: full-screen phone app, same as the tax AI prototype. Home chat → handoff → agent conversation (one question at a time, right-aligned reply pills) → result card. The pill to tap next always shows the yellow nudge. */
:root{
--bg:#FFFFFF; --ink:#2B2A27; --sub:#6B7280; --mute:#8A867B; --line:#E6E2D6;
--blue:#3A63D8; --nudge:#F7EE6E; --btn:#111111; --warn:#B54708;
--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 4px 12px rgba(247,238,110,.8)}50%{box-shadow:0 4px 18px rgba(247,226,60,1)}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite;margin-right:3px}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.fade,.dot,.gp .go{animation:none!important}}
.topbar{flex:none;height:56px;padding:0 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.topbar>:last-child{justify-self:end;display:flex;align-items:center}
.topbar>:first-child{justify-self:start}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.icon-btn:hover{background:rgba(25,27,31,.05)}
.spacer{width:44px;height:44px}
.agent-title{font-size:16px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.flow{min-height:100%;padding:0 20px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
.ava{flex:none;height:44px;display:flex;align-items:center}
.ai{font-size:18px;line-height:1.5;font-weight:400;letter-spacing:-.2px;word-break:keep-all;margin:0}
.ai b{font-weight:700}
.flow.hm{justify-content:flex-start;padding-top:56px}
.hl{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.hl-r{position:relative;display:flex;flex-direction:column;padding:12px 12px;margin:0 -12px;border-radius:14px;color:var(--ink);text-decoration:none}
.hl-r:active{background:rgba(25,27,31,.05)}
.hl-t{font-size:18px;font-weight:700;letter-spacing:-.2px}
.hl-s{font-size:13.5px;color:var(--sub);margin-top:2px;word-break:keep-all}
.hl-go{position:absolute;right:6px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:var(--nudge);display:flex;align-items:center;justify-content:center;animation:glow 1.8s ease-in-out infinite}
.ai-s{font-size:14px;color:var(--sub);word-break:keep-all;margin-top:6px;display:block;letter-spacing:0}
.aimsg{font-size:16px;margin:0;word-break:keep-all}
.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:22px;padding:11px 18px;font-size:15px;font-weight:500;max-width:80%}
.status{display:flex;align-items:center;gap:8px;font-size:15px;color:#3B4252}
/* reply pills */
.replies{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.gp{display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid rgba(25,27,31,.22);background:transparent;border-radius:22px;padding:0 18px;font-size:15px;font-weight:500;color:var(--ink);transition:padding .2s,background .2s,box-shadow .2s}
.gp:hover{background:rgba(25,27,31,.03)}
.gp .go{display:none;width:32px;height:32px;border-radius:50%;background:var(--nudge);align-items:center;justify-content:center;animation:glow 1.8s ease-in-out infinite}
.gp[aria-pressed=true]{background:#fff;padding-right:6px;border-color:rgba(25,27,31,.12);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.gp[aria-pressed=true] .go{display:flex}
/* preview / result cards */
.glass{background:#F5F5F6;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.prow span:first-child{color:var(--sub)}
.prow span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.prow.warn span:last-child{color:var(--warn)}
.card{background:#fff;border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.07)}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--blue)}
.ck i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.ck i.off{background:#C9CCD3}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:14px}
.card .sub{font-size:14px;color:var(--sub);margin-top:4px;word-break:keep-all}
.rows{margin-top:16px;display:flex;flex-direction:column}
.sumrow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:15px}
.sumrow span:first-child{color:var(--sub);flex:none}
.sumrow span:last-child{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.endrow{display:flex;justify-content:flex-end}
.next{height:46px;padding:0 24px;border:0;border-radius:23px;background:var(--btn);color:#fff;font-weight:600;font-size:15px}
.chart{background:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(60,50,30,.07)}
.chart .k{font-size:12px;font-weight:600;color:var(--blue)}
.bar{height:12px;border-radius:6px;overflow:hidden;display:flex;gap:2px;margin:8px 0 6px}
.bar div{height:100%}
.leg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.leg:first-of-type{border-top:0}
.leg .sw{flex:none;width:10px;height:10px;border-radius:3px}
.leg .n{flex:1;min-width:0}
.leg .p{color:var(--sub);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.leg .a{font-weight:700;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.chart .small{font-size:12px;color:var(--sub);word-break:keep-all;margin-top:4px}
.chart .small.warn{color:var(--warn)}
/* more menu + add-to-home sheet */
#ov{display:none}
#ov.on{display:block;position:fixed;inset:0;z-index:50}
.ov-bg{position:absolute;inset:0}
#ov.dim .ov-bg{background:rgba(20,20,20,.38)}
.pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);right:12px;min-width:250px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.16);border:1px solid var(--line)}
.pop-i{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:transparent;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.pop-i:hover{background:rgba(25,27,31,.05)}
.pi-ic{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.sheetp{position:absolute;left:0;right:0;bottom:0;background:#FBFAF6;border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(60,50,30,.12);padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.sp-h{display:flex;align-items:center;gap:14px}
.sp-h b{display:block;font-size:20px;letter-spacing:-.3px}
.sp-h span:not([style]){display:block;font-size:14px;color:var(--sub)}
.sp-tabs{display:flex;gap:8px;margin:16px 0 4px}
.sp-tabs button{min-height:36px;border:1px solid transparent;background:#EDEAE1;border-radius:18px;padding:0 16px;font-size:14px;font-weight:500;color:var(--ink)}
.sp-tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.sp-steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;word-break:keep-all}
.sp-steps li::marker{font-weight:700;color:var(--sub)}
.sp-note{font-size:12px;color:var(--mute);margin:12px 0 0;word-break:keep-all}
.sp-btns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.chipb{min-height:44px;border:1px solid rgba(25,27,31,.22);background:transparent;border-radius:22px;padding:0 18px;font-size:15px;font-weight:500;color:var(--ink)}
.fbin{width:100%;box-sizing:border-box;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);background:#fff}
/* biometric sheet + 2-line bubbles */
.me{line-height:1.45;text-wrap:balance;border-radius:20px}
.gp{padding:8px 18px;border-radius:24px}
.gp>span{line-height:1.4;text-wrap:balance;word-break:keep-all}
.bio{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.bio-bg{position:absolute;inset:0;background:rgba(20,20,20,.38)}
.bio-sh{position:relative;width:100%;box-sizing:border-box;background:#fff;border-radius:26px 26px 0 0;padding:26px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.bio-sh .t{font-size:17px;font-weight:700}

function fitBubbles(){
  var els=document.querySelectorAll('.me,.bub,.gp>span');
  els.forEach(function(el){el.style.width=''});
  els.forEach(function(el){
    var r=document.createRange();r.selectNodeContents(el);
    var rects=r.getClientRects();if(rects.length<2)return;
    var w=0;for(var i=0;i<rects.length;i++)w=Math.max(w,rects[i].width);
    var full=el.getBoundingClientRect().width,cs=getComputedStyle(el);
    var pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);

    if(target<full-2)el.style.width=target+'px';
  });
}

/* 증분 렌더링: 바뀐 노드만 교체해서 기존 내용이 다시 로드되며 튀지 않게 */
function sigAll(el){Array.prototype.forEach.call(el.children,function(c){c._sig=c.outerHTML;var f=c.classList.contains('scroll')&&c.firstElementChild;if(f&&f.classList.contains('flow')){Array.prototype.forEach.call(f.children,function(x){x._sig=x.outerHTML})}})}
function syncList(o,n){
  var oc=Array.prototype.slice.call(o.children),nc=Array.prototype.slice.call(n.children);
  nc.forEach(function(c,i){
    var sig=c.outerHTML,old=oc[i];
    if(!old){c._sig=sig;o.appendChild(c);return}
    if(old._sig===sig)return;
    c._sig=sig;o.replaceChild(c,old);
  });
  for(var i=nc.length;i<oc.length;i++)o.removeChild(oc[i]);
}
function patch(html){
  var app=$('#app'),t=document.createElement('div');t.innerHTML=html;
  var ns=t.firstElementChild,os=app.firstElementChild;
  if(!os||!ns||os.className!==ns.className){app.innerHTML=html;var s0=app.firstElementChild;if(s0)sigAll(s0);return}
  var oc=Array.prototype.slice.call(os.children),nc=Array.prototype.slice.call(ns.children);
  nc.forEach(function(c,i){
    var sig=c.outerHTML,old=oc[i];
    if(!old){c._sig=sig;os.appendChild(c);return}
    if(old._sig===sig)return;
    var of=old.classList.contains('scroll')&&old.firstElementChild,nf=c.classList.contains('scroll')&&c.firstElementChild;
    if(of&&nf&&of.className===nf.className){syncList(of,nf);old._sig=sig;return}
    c._sig=sig;os.replaceChild(c,old);
  });
  for(var i=nc.length;i<oc.length;i++)os.removeChild(oc[i]);
}

render();

<style>
/* Layout: same phone shell as the salary prototype. Home → handoff → 6 agent steps (consent, scan, plan, sell timing, execute, journey). The pill to tap next always shows the yellow nudge. */
:root{
--bg:#FFFFFF; --ink:#2B2A27; --sub:#6B7280; --mute:#8A867B; --line:#E6E2D6;
--blue:#3A63D8; --blue2:#8FA8E8; --sand:#C9C4B6; --nudge:#F7EE6E; --btn:#111111; --warn:#B54708; --soft:#F5F5F6;
--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 4px 12px rgba(247,238,110,.8)}50%{box-shadow:0 4px 18px rgba(247,226,60,1)}}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite;margin-right:3px}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.fade,.dot,.gp .go{animation:none!important}}
.topbar{flex:none;height:56px;padding:0 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.topbar>:last-child{justify-self:end;display:flex;align-items:center}
.topbar>:first-child{justify-self:start}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink)}
.icon-btn:hover{background:rgba(25,27,31,.05)}
.spacer{width:44px;height:44px}
.agent-title{font-size:16px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.flow{min-height:100%;padding:0 20px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.ava{flex:none;height:44px;display:flex;align-items:center}
.ai{font-size:18px;line-height:1.5;font-weight:400;letter-spacing:-.2px;word-break:keep-all;margin:0}
.ai b{font-weight:700}
.ai-s{font-size:14px;color:var(--sub);word-break:keep-all;margin-top:6px;display:block;letter-spacing:0}

.drw-r.on{background:#E7E9EE!important}
.drw-s{background:#fff!important}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
</style>
<div id="stage"><div id="ov"></div><div id="app"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var comma=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')};
var fm=function(n){n=Math.abs(n);return n>=10000?Number((n/10000).toFixed(2))+'억원':comma(n)+'만원'}; // 입력 단위는 만원

/* ---------- 예시 데이터 (프로토타입용, 단위 만원) ---------- */
var AGENT='내집마련 에이전트';
var PRICE=78000, TAX=1890, NEED=PRICE+TAX;          // 매수가 7.8억 + 취득세 약 1,890만
var JEONSE=14000;                                    // 전세보증금 4.2억 − 전세대출 2.8억 상환
var STOCK_KR=5000, STOCK_US=3000;
var rebuttal='지금 환율 1,320원에 팔면 1,380원일 때보다 약 135만원을 덜 받아요. 해외주식은 잔금일(D+26)이 아니라 취득세 납부 때 쓰여서 서둘 이유가 없어요. 1,380원 이상이 되면 바로 알려 드릴게요.';
var DEFAULTS={who:'both',loan:'40',sell:'split'};
var st={phase:'home',step:0,n:0,rebut:false,msgs:[],user:'',hs:0,authing:false,bio:null};
function resetSel(){st.said='';for(var k in DEFAULTS)st[k]=DEFAULTS[k];st.rebut=false;st.n=0;st.authing=false}
resetSel();
var timers=[];
function clearT(){timers.forEach(clearTimeout);timers=[]}
function set(p){for(var k in p)st[k]=p[k];render()}

/* ---------- 핵심 로직 ---------- */
function calc(){
  var cash=st.who==='both'?19000:11000;   // 본인+배우자 / 본인만
  var loan=+st.loan*1000;
  var stock=STOCK_KR+STOCK_US;
  var src=[{n:'주택담보대출',e:'매수가의 '+Math.round(loan/PRICE*100)+'%',v:loan,c:'var(--blue)'},
           {n:'전세보증금 순반환',e:'보증금 4.2억 − 전세대출 2.8억',v:JEONSE,c:'var(--ink)'},
           {n:'내 현금',e:st.who==='both'?'나·이형석 합산':'내 계좌만',v:cash,c:'var(--sand)'},
           {n:'주식 매도',e:'국내 5,000만 + 해외 3,000만',v:stock,c:'var(--blue2)'}];
  var total=src.reduce(function(a,s){return a+s.v},0);
  var pc=src.map(function(s){return Math.round(s.v/total*100)});
  pc[pc.length-1]+=100-pc.reduce(function(a,b){return a+b},0);
  return {src:src,pc:pc,total:total,cash:cash,loan:loan,spare:total-NEED};
}

/* ---------- icons ---------- */
var STAR=function(n,g){return '<svg aria-hidden="true" width="'+n+'" height="'+n+'" viewBox="0 0 24 24"><defs><linearGradient id="'+g+'" x1="0.1" y1="0.05" x2="0.9" y2="0.95"><stop offset="0" stop-color="#4FC4FC"/><stop offset=".38" stop-color="#6DD3BE"/><stop offset=".72" stop-color="#A5DC43"/><stop offset="1" stop-color="#D8E24B"/></linearGradient></defs><path d="M12 4.6Q14.2 9.8 19.4 12Q14.2 14.2 12 19.4Q9.8 14.2 4.6 12Q9.8 9.8 12 4.6Z" fill="url(#'+g+')" stroke="url(#'+g+')" stroke-width="4.4" stroke-linejoin="round"/><rect x="11.05" y="8.3" width="1.9" height="7.4" rx=".25" fill="#fff"/></svg>'};
var BADGE=function(n,g){return '<svg aria-hidden="true" width="'+Math.round(n*1.2)+'" height="'+n+'" viewBox="0 0 30 25"><defs><clipPath id="'+g+'c"><circle cx="19" cy="12.5" r="9"/></clipPath></defs><circle cx="11" cy="12.5" r="9" fill="#58D08C"/><circle cx="19" cy="12.5" r="9" fill="#2F66E3"/><circle cx="11" cy="12.5" r="9" fill="#3FB8A6" clip-path="url(#'+g+'c)"/><path d="M15 7.5l-4 3.6V17h2.6v-3h2.8v3H19v-5.9z" fill="#fff"/></svg>'};
var MIC='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
var PLUS='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
var WAVE='<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" stroke-linejoin="round"/></svg>';
var BACK='<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
var ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#191B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var CHECK=function(s,c){return '<svg aria-hidden="true" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'#fff')+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};

/* ---------- pieces ---------- */
function gp(attr,label,on,ag){return '<button class="gp" '+attr+' aria-pressed="'+(!!on)+'"><span>'+label+'</span><i class="go" aria-hidden="true">'+ARROW+'</i></button>'}
function composer(ph){return '<div class="foot"><div class="composer"><textarea id="in" rows="1" aria-label="'+ph+'" placeholder="'+ph+'" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea><div class="tools"><button class="plus" aria-label="추가">'+PLUS+'</button><div class="rt"><button class="mic" aria-label="음성으로 입력">'+MIC+'</button><button class="send" id="send" aria-label="보내기">'+WAVE+'</button></div></div></div></div>'}
function sr(a,b){return '<div class="sumrow"><span>'+a+'</span><span>'+b+'</span></div>'}
function agst(t,done){return '<div class="status fade"><span style="display:inline-flex;'+(done?'':'animation:pulse 1.2s infinite')+'">'+BADGE(20,'hb')+'</span><span>'+t+'</span>'+(done?'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2FB67C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'')+'</div>'}
function dots(t){return '<div class="status fade"><span class="tdots" aria-hidden="true"><i></i><i></i><i></i></span><span class="stt">'+t+'</span></div>'}
function leg(col,name,sub,p,a){return '<div class="leg"><i class="sw" style="background:'+col+'"></i><span class="n">'+name+(sub?'<em>'+sub+'</em>':'')+'</span>'+(p!==null?'<span class="p">'+p+'%</span>':'')+'<span class="a">'+a+'</span></div>'}
function trow(day,name,sub,ag){return '<div class="trow"><span class="day">'+day+'</span><span class="n">'+name+(sub?'<em>'+sub+'</em>':'')+'</span><span class="ag">'+ag+'</span></div>'}
function mn(fresh,day,title,steps){
  var r=steps.map(function(x){var m=x[0]==='마스터';return '<div class="mr'+(m?' m':'')+'"><i></i><div><span class="mw">'+(m?'마스터 에이전트 · 판단':x[0]+' 에이전트 · 처리')+'</span><span class="mt">'+x[1]+'</span></div></div>'}).join('');
  return '<div class="notif mn'+(fresh?' fade':'')+'"><div class="nh"><span class="day">'+day+'</span></div><b>'+title+'</b><div class="mf">'+r+'</div></div>';
}
function notif(cls,day,ags,title,body){return '<div class="notif '+cls+'"><div class="nh"><span class="day">'+day+'</span>'+ags+'</div><b>'+title+'</b><p>'+body+'</p></div>'}

/* ---------- 부부 채팅방 (앞단) ---------- */
var CALLMSG='@내집마련 에이전트 전세대출, 매수, 취득세, 주식 매도까지 우리 집 사는 날 기준으로 같이 정리해줘';
var TALK=[['w','전세대출 이자 또 바뀐대. 이번 달 고지서 봤어?','오전 10:27'],
          ['h','봤어. 이참에 우리 집을 사는 게 낫지 않나 싶어.','오전 10:27'],
          ['w','근데 대출에 취득세까지 한꺼번에 얼마가 드는지 모르겠어. 주식은 언제 팔아야 할지도 모르겠고.','오전 10:28'],
          ['h','그럼 AI한테 같이 물어보자. 둘이 같이 보는 게 낫잖아.','오전 10:28']];
var av=function(ch,bg,fg,s){return '<span style="flex:none;width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+bg+';color:'+fg+';display:inline-flex;align-items:center;justify-content:center;padding-top:2px;box-sizing:border-box;font-size:'+Math.round(s*.42)+'px;font-weight:700">'+ch+'</span>'};
var AV_H=function(s){return av('나','#E8EFFC','#3A63D8',s)};
var AV_W=function(s){return av('이','#FDF0E3','#B54708',s)};
var talkShown=false; // 앞단 대화 등장 연출은 처음 한 번만
function roomHTML(){
  var A=talkShown?'':' fade';
  var h='<div class="screen"><div class="topbar"><button class="listb" id="chats" aria-label="챗 목록">'+LISTI+'</button><span class="agent-title"><span class="pair">'+AV_H(28)+AV_W(28)+'</span>이형석</span>'+MORE+'</div>';
  h+='<div class="scroll" id="sc"><div class="flow room">';
  h+='<div class="sysline">오늘 오전 9:41</div>';
  TALK.forEach(function(m,i){
    var d=talkShown?'':'style="animation-delay:'+(i*0.45)+'s"';
    h+=m[0]==='w'?'<div class="mrow'+A+'" '+d+'><div class="bub">'+m[1]+'</div></div>'
                 :'<div class="me'+A+'" '+d+'>'+m[1]+'</div>';
  });
  if(st.phase==='home'){
    st.msgs.forEach(function(m){h+=m.w==='me'?'<div class="me fade">'+esc(m.t)+'</div>':'<div class="sysline fade">'+esc(m.t)+'</div>'});
    h+='<div class="replies'+A+'"'+(A?' style="animation-delay:1.9s"':'')+'>'+gp('data-call="1"','@내집마련 에이전트 불러서 같이 정리하기',true)+gp('data-later="1"','나중에 얘기하자',false)+'</div>';
  }else{
    h+='<div class="me fade">'+esc(st.user)+'</div>';
    h+='<div class="sysline fade"><span style="vertical-align:-3px">'+STAR(16,'gs')+'</span> 내집마련 에이전트가 대화에 참여했어요</div>';
    h+=agst(st.hs?'자산조회·대출설계·투자매매·실행·세금 에이전트를 연결했어요':'마스터 에이전트가 필요한 에이전트를 부르고 있어요',st.hs);
  }
  h+='</div></div>'+composer('메시지 입력')+'</div>';
  talkShown=true;
  return h;
}
function startHandoff(text){
  clearT();resetSel();
  set({phase:'handoff',user:text,hs:0});
  timers.push(setTimeout(function(){if(st.phase==='handoff')set({hs:1})},1400));
  timers.push(setTimeout(function(){if(st.phase==='handoff')set({phase:'agent',step:0})},2800));
}

/* ---------- agent steps ---------- */
var SCAN=[['자산조회','14개 금융사의 계좌·대출·주식을 한 번에 조회했어요'],
          ['자산조회','제3자가 포함된 모임통장 320만원은 자금계획에서 뺐어요'],
          ['대출설계','전세보증금 반환액과 주택담보대출 필요액을 계산했어요'],
          ['대출설계','외부 시세 7.65~7.95억원, 매수가 7.8억원은 적정 범위예요']];
var CALLS=[['자산조회','자산 한 번에 조회','본인·배우자 계좌·대출·주식','14개 금융사 조회 완료 · 모임통장 320만원 제외'],
['대출설계','대출·보증금 계산','전세 반환액과 주담대 한도','필요 대출 4억원 · 시세 7.65~7.95억원은 적정 범위'],
['세금','취득세 계산','신고·납부 기한 포함','취득세 약 1,890만원 · 신고·납부 기한 D+62'],
['투자매매','매도 시점 분석','국내·해외주식 각각','국내 5,000만원 D+4 · 해외 3,000만원 환율 회복 시'],
['실행','실행 준비','전용 통장·자금 집결·적립','승인하면 바로 실행할 수 있게 준비했어요']];
function callRow(x,state){
  var ic=state===2?'<i class="cki">'+CHECK(12)+'</i>':state===1?'<span class="tdots" aria-hidden="true"><i></i><i></i><i></i></span>':'<i class="cwait"></i>';
  var tx=state===2?x[3]:('요청: '+x[1]+(state===1?' · 호출 중':''));
  return '<div class="crow'+(state===2?' ok':'')+(state===1?' on':'')+'"><span class="ci">'+ic+'</span><span class="ct"><b>'+x[0]+' 에이전트</b><em>'+tx+'</em></span></div>';
}
function agrow(list){return '<div class="agrow">'+list.map(function(a){return '<span class="ag ok">'+a+'</span>'}).join('')+'</div>'}
function stepHTML(c){
  var s=st.step,F=(s===2||s===7)?'':' fade',h='';
  if(s===0){
    h+='<p class="ai'+F+'">조회 동의가 필요해요.<br><b>본인과 배우자 자산을 함께</b> 볼까요?<span class="ai-s">'+(st.who==='both'?'모든 금융사의 계좌·대출·주식을 한 번에 조회해요. 이형석 님에게는 공유 동의 요청이 가요.':'이형석 님 예금 8,000만원이 빠져서 자금이 모자랄 수 있어요.')+'</span></p>';
    h+='<div class="chart fade"><span class="k">조회 범위</span>'+leg('var(--blue)','내 명의','계좌·대출·주식',null,'조회')+leg(st.who==='both'?'var(--blue)':'var(--sand)','이형석 님 명의','공유 동의 요청 알림',null,st.who==='both'?'조회':'제외')+leg('var(--sand)','제3자 포함 모임통장','자금계획에서 자동 제외',null,'제외')+'</div>';
    h+='<div class="replies fade">'+gp('data-k="who" data-v="both"','두 사람 모두 동의',st.who==='both')+gp('data-k="who" data-v="self"','내 것만 조회',st.who==='self')+'</div>';
  }
  if(s===1){
    h+='<p class="ai'+F+'">마스터 에이전트가 <b>필요한 에이전트를 나눠 부를게요.</b><span class="ai-s">5개 에이전트가 각자 맡은 일을 하고, 결과는 마스터 에이전트가 하나로 합쳐요.</span></p>';
    h+='<div class="chart fade"><span class="k">작업 분배</span>'+CALLS.map(function(x,i){return trow(String(i+1),x[1],x[2],x[0])}).join('')+'</div>';
    h+='<div class="replies fade">'+gp('data-k="go" data-v="ok"','에이전트 호출하기',true)+'</div>';
  }
  if(s===2){
    var all=st.n>=CALLS.length;
    h+='<p class="ai">'+(all?'<b>모든 에이전트가 답했어요.</b>':'마스터 에이전트가 <b>에이전트를 호출하고 있어요.</b>')+'</p>';
    h+='<div class="chart"><span class="k">에이전트 호출 현황</span>'+CALLS.map(function(x,i){return callRow(x,i<st.n?2:(i===st.n?1:0))}).join('')+'</div>';
    if(all)h+=dots('결과를 하나로 합치는 중이에요');
  }
  if(s===3){
    var short=c.spare<0;
    h+='<p class="ai'+F+'">필요한 돈은 <b>'+fm(NEED)+'</b>, 모을 수 있는 돈은 <b>'+fm(c.total)+'</b>이에요.<span class="ai-s">매수가 '+fm(PRICE)+' + 취득세 약 '+fm(TAX)+' 기준이에요.</span></p>';
    h+='<div class="chart fade"><span class="k">자금 조달 계획</span>'+agrow(['자산조회','대출설계','세금'])+'<div class="bar" role="img" aria-label="자금 조달 비율">';
    c.src.forEach(function(x){h+='<div style="width:'+(x.v/c.total*100)+'%;background:'+x.c+'"></div>'});
    h+='</div>';
    c.src.forEach(function(x,i){h+=leg(x.c,x.n,x.e,c.pc[i],fm(x.v))});
    h+=short?'<span class="small warn">필요한 돈보다 '+fm(c.spare)+' 부족해요.</span>':'<span class="small">필요한 돈을 채우고도 '+fm(c.spare)+'이 남아요.</span>';
    h+='</div>';
    h+='<div class="replies fade">'+gp('data-k="loan" data-v="40"','이대로 진행',st.loan==='40')+gp('data-k="loan" data-v="35"','주택담보대출을 3.5억원으로 줄이기',st.loan==='35')+'</div>';
  }

function fitBubbles(){
  var els=document.querySelectorAll('.me,.bub,.gp>span');
  els.forEach(function(el){el.style.width=''});
  els.forEach(function(el){
    var r=document.createRange();r.selectNodeContents(el);
    var rects=r.getClientRects();if(rects.length<2)return;
    var w=0;for(var i=0;i<rects.length;i++)w=Math.max(w,rects[i].width);
    var full=el.getBoundingClientRect().width,cs=getComputedStyle(el);
    var pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    var target=Math.ceil(w)+(cs.boxSizing==='border-box'?pad:0)+1;
    if(target<full-2)el.style.width=target+'px';
  });
}

/* 증분 렌더링: 바뀐 노드만 교체해서 기존 내용이 다시 로드되며 튀지 않게 */
function sigAll(el){Array.prototype.forEach.call(el.children,function(c){c._sig=c.outerHTML;var f=c.classList.contains('scroll')&&c.firstElementChild;if(f&&f.classList.contains('flow')){Array.prototype.forEach.call(f.children,function(x){x._sig=x.outerHTML})}})}
function syncList(o,n){
  var oc=Array.prototype.slice.call(o.children),nc=Array.prototype.slice.call(n.children);
  nc.forEach(function(c,i){
    var sig=c.outerHTML,old=oc[i];
    if(!old){c._sig=sig;o.appendChild(c);return}
    if(old._sig===sig)return;
    c._sig=sig;o.replaceChild(c,old);
  });
  for(var i=nc.length;i<oc.length;i++)o.removeChild(oc[i]);
}
function patch(html){
  var app=$('#app'),t=document.createElement('div');t.innerHTML=html;
  var ns=t.firstElementChild,os=app.firstElementChild;
  if(!os||!ns||os.className!==ns.className){app.innerHTML=html;var s0=app.firstElementChild;if(s0)sigAll(s0);return}
  var oc=Array.prototype.slice.call(os.children),nc=Array.prototype.slice.call(ns.children);
  nc.forEach(function(c,i){
    var sig=c.outerHTML,old=oc[i];
    if(!old){c._sig=sig;os.appendChild(c);return}
    if(old._sig===sig)return;
    var of=old.classList.contains('scroll')&&old.firstElementChild,nf=c.classList.contains('scroll')&&c.firstElementChild;
    if(of&&nf&&of.className===nf.className){syncList(of,nf);old._sig=sig;return}
    c._sig=sig;os.replaceChild(c,old);
  });
  for(var i=nc.length;i<oc.length;i++)os.removeChild(oc[i]);
}

var LISTI='<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.9" stroke-linecap="round"><path d="M4 8.5h16M4 15.5h10"/></svg>';

function drwRows(q){
  var h='',n=0;
  CHATS.forEach(function(c){
    if(q&&(c.t+' '+c.s).toLowerCase().indexOf(q.toLowerCase())<0)return;n++;
    var cur=c.id===CUR;
    h+='<a class="drw-r'+(cur?' on':'')+'" data-id="'+c.id+'" href="'+c.url+'" target="_top" rel="noopener"'+(cur?' aria-current="true"':'')+'><span class="drw-rt">'+c.t+'</span><span class="drw-rs">'+c.s+'</span></a>';
  });
  return n?h:'<p class="drw-empty">검색 결과가 없어요</p>';
}
var drwOpen=false;

  requestAnimationFrame(function(){requestAnimationFrame(function(){o.classList.add('open');document.body.classList.add('drw-open')})});
}
function drwClose(){
  var o=$('#ov');if(!drwOpen)return ovClose();
  drwOpen=false;o.classList.remove('open');document.body.classList.remove('drw-open');
  setTimeout(function(){if(!drwOpen)ovClose()},340);
}
document.addEventListener('click',function(e){
  var rr=e.target.closest('.drw-r');
  if(rr&&window.parent!==window){e.preventDefault();e.stopPropagation();var gid=rr.getAttribute('data-id');drwClose();if(gid!==CUR)setTimeout(function(){window.parent.postMessage({type:'chat-go',id:gid},'*')},200);return}
  if(drwOpen&&e.target.closest('#app')){e.stopPropagation();e.preventDefault();drwClose();return}
  if(drwOpen&&e.target.closest('[data-ov="close"]')){e.stopPropagation();drwClose();return}
  var nb=e.target.closest('#drw-new');
  if(nb){e.stopPropagation();drwClose();parent.postMessage({type:'new-chat'},'*');return}
  var b=e.target.closest('[data-ov="chats"],#chats');if(b){ovCloseNow();ovChats()}
},true);
function ovCloseNow(){document.body.classList.remove('drw-open');var o=$('#ov');o.innerHTML='';o.className=''}
document.addEventListener('input',function(e){if(e.target.id==='drw-q'){$('#drw-list').innerHTML=drwRows(e.target.value.trim())}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&drwOpen)drwClose()});
(function(){var x0=null;
document.addEventListener('touchstart',function(e){var d=drwOpen&&e.target.closest('.drw,#app');x0=d?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchmove',function(e){if(x0!==null&&e.touches[0].clientX-x0<-60){x0=null;drwClose()}},{passive:true});
})();
render();
})();

<script>
(function(){

function srcOf(id){var t=document.getElementById('src-'+id).textContent.replace(/<\\\/script/g,'</script');
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>'+t+'</body></html>'}
function show(id){
  if(IDS.indexOf(id)<0)id=IDS[0];
  if(!frames[id]){var f=document.createElement('iframe');f.className='fr';f.title=id;f.setAttribute('allow','clipboard-write');f.srcdoc=srcOf(id);stage.appendChild(f);frames[id]=f;void f.offsetWidth}

}

});

show('tax');
})();
